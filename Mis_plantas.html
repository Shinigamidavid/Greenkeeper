    <!-- Modal Planta Usuario -->
    <div class="modal fade" id="plantaModal" tabindex="-1" role="dialog" aria-labelledby="plantaModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="plantaModalLabel">Detalles de la Planta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="resultadoBusqueda">
                    <!-- Resultados de la búsqueda se mostrarán aquí -->
                </div>
            </div>
        </div>
    </div>
    <script>
        $(document).ready(function () {
            // Autocompletado
            $('#nombreComun').autocomplete({
                source: function (request, response) {
                    $.ajax({
                        url: 'buscar_planta.php',
                        method: 'GET',
                        dataType: 'json', // Asegúrate de tener este tipo de datos
                        data: {
                            term: request.term
                        },
                        success: function (data) {
                            response(data);
                        },
                        error: function (xhr, status, error) {
                            console.error("Error en AJAX:", xhr.responseText);
                        }
                    });
                }
            });


            $('#nombreComun').on('keypress', function (e) {
                if (e.which === 13) {
                    e.preventDefault();
                    $('#buscarBtn').click();
                }
            });

            $('#buscarBtn').click(function () {
                var nombreComun = $('#nombreComun').val();
                if (nombreComun) {
                    $.ajax({
                        url: 'getPlantaUsu.php',
                        method: 'GET',
                        data: {
                            nombreComun: nombreComun
                        },
                        success: function (data) {
                            $('#resultadoBusqueda').html(data);
                            var myModal = new bootstrap.Modal(document.getElementById('plantaModal'));
                            myModal.show();
                        },
                        error: function (xhr, status, error) {
                            console.error(xhr);
                        }
                    });
                }
            });
        });

    </script>

    <div id="carouselExampleControls" class="carousel slide d-none d-sm-block" data-bs-ride="carousel">
        <div class="carousel-inner" id="cards-container">
            <!-- Las tarjetas generadas se insertarán aquí -->
        </div>

            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('plantaTarjetaCarrousel.php')
                .then(response => response.text())
                .then(data => {
                    // Inserta las tarjetas en el contenedor del carrusel
                    const container = document.getElementById('cards-container');
                    container.innerHTML = data;

                    // Agrega la clase 'active' a la primera tarjeta
                    const firstItem = container.querySelector('.carousel-item');
                    if (firstItem) {
                        firstItem.classList.add('active');
                    }
                });
        });

    </script>
